# CCE Example Configuration — Huawei Cloud Cloud Container Engine

```yaml
# CCE common alarm thresholds
alarm_thresholds: &alarm_thresholds
  cpu_util_critical: 90
  cpu_util_warning: 80
  memory_util_warning: 85
  disk_util_warning: 90

# Notification channels (anchored individually for template reuse)
notification:
  critical_topic: &notification_critical "urn:smn:{{env.HW_REGION_ID}}:{{env.HW_PROJECT_ID}}:cce-critical-alerts"
  warning_topic: &notification_warning "urn:smn:{{env.HW_REGION_ID}}:{{env.HW_PROJECT_ID}}:cce-warning-alerts"

# CCE alarm templates reuse the shared alarm_thresholds + notification anchors
alarm_templates:
  - <<: *alarm_thresholds
    name: "cce-cluster-cpu-critical"
    namespace: "SYS.CCE"
    metric_name: "cpu_util"
    threshold: 90
    alarm_level: 1
    evaluation_periods: 3
    alarm_actions: *notification_critical
  - <<: *alarm_thresholds
    name: "cce-cluster-memory-warning"
    namespace: "SYS.CCE"
    metric_name: "memory_util"
    threshold: 85
    alarm_level: 2
    evaluation_periods: 3
    alarm_actions: *notification_warning
  - name: "cce-node-notready"
    namespace: "SYS.CCE"
    metric_name: "cluster_node_status"
    threshold: 0
    alarm_level: 1
    evaluation_periods: 2
    alarm_actions: *notification_critical
    dimension_key: "instance_id"

# FinOps idle node detection
finops:
  idle_cpu_threshold_percent: 10
  idle_window_days: 7
  idle_node_age_days: 14
  unattached_eip_age_days: 7
  spot_fallback_threshold_percent: 30

# Cluster defaults
cluster_defaults: &cluster_defaults
  k8s_version: "1.28"
  container_network_mode: "vpc"
  billing_mode: 0
  enable_authentication: true
  enable_ipv6: false

# Node pool defaults
nodepool_defaults: &nodepool_defaults
  scaling_min: 1
  scaling_max: 10
  scaling_priority: 1

# Worker output contract (CCE Read-Only Assessment)
worker:
  skill_id: huaweicloud-cce-ops
  product: cce
  region: "{{env.HW_REGION_ID}}"
  output_contract: "{{output.product_assessment}}"
  anchor: "&huaweicloud-skill-generator/references/worker-output-schema.md"
```
