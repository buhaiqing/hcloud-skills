name: Validate Skills

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- Go: build the skillcheck binary (A-class validation surface) ---
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build skillcheck
        working-directory: skillcheck
        run: go build -trimpath -o ../bin/skillcheck .

      - name: gofmt clean
        working-directory: skillcheck
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        working-directory: skillcheck
        run: go vet ./...

      - name: Go test
        working-directory: skillcheck
        run: go test ./... -count=1

      # --- Go: run the A-class total entry (replaces the prior Python per-check steps) ---
      - name: skillcheck validate (A-class total entry)
        run: ./bin/skillcheck validate --root .

      - name: skillcheck check markdown-links
        run: ./bin/skillcheck check markdown-links --root .

      - name: skillcheck check references-links
        run: ./bin/skillcheck check references-links --root .

      - name: skillcheck check example-config
        run: ./bin/skillcheck check example-config --root .

      - name: skillcheck check advanced-coverage (TE-7)
        run: ./bin/skillcheck check advanced-coverage --root .

      - name: skillcheck check audit-results
        run: ./bin/skillcheck check audit-results --root .

      # --- Go: GCL surface (replaces prior gcl_runner.py / gcl_alarm_wire.py / gcl_trace_aggregate.py) ---
      - name: skillcheck aggregate trace
        run: ./bin/skillcheck aggregate trace --root .

      - name: skillcheck gcl alarm-wire (no mutations)
        run: |
          ./bin/skillcheck gcl alarm-wire --root . \
            --plan-file scripts/fixtures/gcl-quality-summary-healthy.json || true

      # --- Go: new learning + l4 subcommands ---
      - name: skillcheck learning gen (idempotent)
        run: ./bin/skillcheck learning gen --root .

      - name: skillcheck l4 handle smoke
        run: ./bin/skillcheck l4 handle --fault "smoke" --risk low --root .

      # --- Python: remaining scripts (Critic-isolated + skill_generator drift guard) ---
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ruff Python lint
        uses: astral-sh/ruff-action@v3
        with:
          version: 0.11.8
          args: check --output-format=github scripts/

      - name: skill_generator drift guard (Python-only, per AGENTS.md)
        run: python3 scripts/check_skill_generator_drift.py check
