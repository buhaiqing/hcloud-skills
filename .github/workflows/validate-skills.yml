name: Validate Skills

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # --- Go: build the hwcloud-skillcheck binary (A-class validation surface) ---
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: hwcloud-skillcheck/go.sum

      - name: Build hwcloud-skillcheck
        working-directory: hwcloud-skillcheck
        run: go build -trimpath -o ../bin/hwcloud-skillcheck .

      # --- Unified pre-commit gate (ADR-0014) ---
      # `check --pre-commit --check-only` runs 14 gates in a single pass:
      #   [1] gofmt    [2] go vet    [3] validate (frontmatter+eval-queries+
      #       product-assessment+markdown-links+example-config+advanced-coverage)
      #   [4] audit-results    [5] aggregate trace (--require-traces)
      #   [6] learning gen    [7] l4 handle smoke    [8] golden run (soft)
      #   [9] check lanes    [10] ab compare (soft)    [11] advanced-coverage
      #   [12] drift guard (check-only in CI)    [13] go test
      #   [14] critic score (fixture smoke)
      - name: hwcloud-skillcheck check --pre-commit (unified gate)
        run: ./bin/hwcloud-skillcheck check --pre-commit --check-only --root .
