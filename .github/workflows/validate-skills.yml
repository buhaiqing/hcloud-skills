name: Validate Skills

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # --- Go: build the hwcloud-skillcheck binary (A-class validation surface) ---
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: hwcloud-skillcheck/go.sum

      - name: Build hwcloud-skillcheck
        working-directory: hwcloud-skillcheck
        run: go build -trimpath -o ../bin/hwcloud-skillcheck .

      # --- Unified pre-commit gate (ADR-0014) ---
      # `check --pre-commit --check-only --test-retries 2` runs 16 gates:
      #   [1] gofmt (hard)   [2] go vet (hard)
      #   [3] validate (hard — frontmatter+eval-queries+product-assessment+
      #       markdown-links+example-config+advanced-coverage)
      #   [4] audit-results (hard)   [5] aggregate trace (hard)
      #   [6] learning gen (hard)   [7] l4 handle smoke (hard)
      #   [8] golden run (soft)   [9] check lanes (hard)
      #   [10] ab compare (soft)   [11] advanced-coverage (hard)
      #   [12] drift guard (hard — sync+check; sync bootstraps .agents/skills/
      #       on fresh CI checkout)
      #   [13] go test (hard, 3 attempts with --test-retries 2)
      #   [14] drift sync --dry-run (soft)   [15] gcl alarm-wire (soft)
      #   [16] critic score (soft — fixture smoke)
      - name: hwcloud-skillcheck check --pre-commit (unified gate)
        run: ./bin/hwcloud-skillcheck check --pre-commit --check-only --test-retries 2 --root .
