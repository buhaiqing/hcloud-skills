name: Validate Skills

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # --- Go: build the hwcloud-skillcheck binary (A-class validation surface) ---
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: hwcloud-skillcheck/go.sum

      - name: Build hwcloud-skillcheck
        working-directory: hwcloud-skillcheck
        run: go build -trimpath -o ../bin/hwcloud-skillcheck .

      # --- Unified pre-commit gate ---
      # `check --pre-commit --check-only` runs 14 gates in a single pass:
      #   1. gofmt clean        2. go vet
      #   3. go test            4. validate (markdown-links, references-links,
      #                             example-config, advanced-coverage)
      #   5. check audit-results 6. aggregate trace (--require-traces)
      #   7. gcl alarm-wire     8. learning gen (idempotent)
      #   9. l4 handle smoke   10. drift sync --dry-run (smoke path)
      #  11. drift check       12. golden run
      #  13. check lanes       14. ab compare
      #  15. check advanced-coverage
      #  16. critic score (smoke fixture)
      - name: hwcloud-skillcheck check --pre-commit (unified gate)
        run: ./bin/hwcloud-skillcheck check --pre-commit --check-only --root .
