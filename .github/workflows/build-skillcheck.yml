name: Build hwcloud-skillcheck

# Cross-platform build + release of the `hwcloud-skillcheck` Go binary.
# The module lives in the `hwcloud-skillcheck/` subdirectory, so every Go step runs
# with `working-directory: hwcloud-skillcheck`. On a `v*` tag push, the matrix
# artifacts are published as a GitHub Release so external users can download a
# standalone binary with no Go toolchain (see docs/superpowers/specs/hwcloud-skillcheck-cli.md).
#
# Day-to-day CI (gofmt/vet/test + skill validation) lives in validate-skills.yml.
# This workflow runs only on version tags to avoid duplicating that gate on every push.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # needed to publish release assets on tag push

env:
  MODULE_DIR: hwcloud-skillcheck
  GO_VERSION: "1.26"

jobs:
  test:
    name: Test & lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hwcloud-skillcheck
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: hwcloud-skillcheck/go.sum
      - name: Verify gofmt is clean
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test (with retry for flaky race detection)
        run: |
          for i in 1 2; do
            if go test ./... -count=1; then
              exit 0
            fi
            echo "Retry $i failed, trying once more..."
          done
          go test ./... -count=1

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    defaults:
      run:
        working-directory: hwcloud-skillcheck
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: hwcloud-skillcheck/go.sum

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          bin="hwcloud-skillcheck"
          if [ "${{ matrix.goos }}" = "windows" ]; then bin="hwcloud-skillcheck.exe"; fi
          out="hwcloud-skillcheck-${{ matrix.goos }}-${{ matrix.goarch }}"
          mkdir -p ../dist
          go build -trimpath -ldflags="-s -w" -o "../dist/${out}" .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: hwcloud-skillcheck-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/hwcloud-skillcheck-${{ matrix.goos }}-${{ matrix.goarch }}*

  release:
    name: Release (tagged)
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/hwcloud-skillcheck-*
          generate_release_notes: true
